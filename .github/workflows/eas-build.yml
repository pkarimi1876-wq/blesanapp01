
name: EAS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo authentication
        run: npx eas-cli@24.8.0 whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app with EAS
        id: eas-build
        run: |
          BUILD_OUTPUT=$(npx eas-cli@24.8.0 build --platform android --profile preview --non-interactive --wait)
          echo "$BUILD_OUTPUT"

          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oE '[a-f0-9]{8}-[a-f0-9-]{27,}' | tail -1)

          if [ -z "$BUILD_ID" ]; then
            echo "Could not find EAS Build ID"
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          npx eas-cli@24.8.0 build:download \
            --build-id "${{ steps.eas-build.outputs.build_id }}" \
            --path ./blesanapp.apk \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: blesanapp-android-apk
          path: "blesanapp.apk"
          if-no-files-found: error

