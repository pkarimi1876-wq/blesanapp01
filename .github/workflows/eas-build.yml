- name: Check Expo authentication
  env:
    EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  run: |
    if [ -z "$EXPO_TOKEN" ]; then
      echo "EXPO_TOKEN is missing"
      exit 1
    fi

    echo "EXPO_TOKEN is present"
    npx eas-cli@24.8.0 whoami

      - name: Build Android app with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
